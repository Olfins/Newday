<style>

.dtl{display:flex;gap:16px;align-items:center;margin-top:10px}.dtl>div{flex:1;display:grid;gap:4px}

.ax{display:flex;justify-content:space-between;margin-top:4px}.ax small{color:var(--mu);font-size:11px}

.offwrap{display:grid;gap:14px;overflow:hidden}
.offwrap.gone{display:none}

@keyframes fold{from{opacity:1;max-height:1800px}to{opacity:0;transform:scale(.94);max-height:0}}

.em{display:inline-block;filter:grayscale(1) contrast(1.3) brightness(1.2)}

:root[data-theme="nuage"]{--tx:#241a10;--mu:#5c4830;--ink:#f8eed6;--ok:#2f6b55;--lap:#2b4a94;--ver:#b23a2a;--or:#b8862d}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,textarea{touch-action:manipulation}
main{padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right)) 130px max(16px,env(safe-area-inset-left));gap:16px}
[data-theme=nuage] body{font-size:17px;line-height:1.45}
[data-theme=nuage] .mu{font-size:15px}
[data-theme=nuage] .wk small,[data-theme=nuage] .ax small,[data-theme=nuage] .kpi small,[data-theme=nuage] .fq,[data-theme=nuage] .cd small{font-size:13px}
[data-theme=nuage] input,[data-theme=nuage] textarea{font-size:16px;min-height:46px}
::placeholder{color:#6f5c40;opacity:1}
[data-theme=nuage] .chips button,[data-theme=nuage] .btn{min-height:44px;padding:8px 16px;font-size:16px}
[data-theme=nuage] .moods button{width:48px;height:48px;font-size:22px;padding:0;font-weight:700}
[data-theme=nuage] .ev button{min-width:44px;min-height:44px}
[data-theme=nuage] .fq{min-height:32px;padding:4px 0}
[data-theme=nuage] .row{grid-template-columns:repeat(7,1fr);gap:6px 4px;margin-top:14px}
[data-theme=nuage] .row>span{grid-column:1/-1}
[data-theme=nuage] .row>span:empty{display:none}
[data-theme=nuage] .row small{text-align:center}
[data-theme=nuage] .row .dot{width:100%;max-width:44px;height:auto;aspect-ratio:1;justify-self:center;font-size:16px}
[data-theme=nuage] .todo{min-height:52px}
[data-theme=nuage] .todo .dot{width:34px;height:34px;flex:none}
[data-theme=nuage] .dot.on,[data-theme=nuage] .big.on{background:var(--ok)}
[data-theme=nuage] .wkn{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;background:rgba(232,219,184,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:22px;padding:4px 2px;box-shadow:0 4px 14px rgba(80,55,20,.12)}

.t-cours{background:var(--lap)}.t-rdv{background:var(--or)}.t-ex{background:var(--ver)}
[data-theme=nuage] h1::first-letter{color:var(--ac)}
[data-theme=nuage] .card>h2,[data-theme=nuage] .card:not(.hero) .top h2{text-transform:none;font-variant:small-caps;letter-spacing:.06em;font-size:19px;font-weight:700}
[data-theme=nuage] .card:not(.hero)+.card:not(.hero)::before{content:"";display:block;height:1px;margin:0 0 14px;background:linear-gradient(90deg,transparent,rgba(150,110,40,.55),transparent)}
[data-theme=nuage] .bg::after{opacity:.38}
.dock .tabs{border:1px solid rgba(201,150,47,.35)}
.dock .tabs button{min-height:44px;font-size:15px}
.plus{width:56px;height:56px}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid var(--lap);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

${linkHTML()}<section class="card"><h2>Sauvegarde</h2><div class="mu">Tes données sont enregistrées sur cet appareil. Génère une copie pour la garder ailleurs. Restaurer remplace les données actuelles.</div><textarea id="bk" placeholder="Colle ici une sauvegarde pour la restaurer"></textarea><div class="inrow" style="margin-top:10px"><button class="btn" onclick="bkOut()">Générer</button><button class="btn" onclick="bkIn()">Restaurer</button></div><div class="mu" id="bm" style="margin-top:6px"></div></section>`}
function calHTML(){
const [Y,M]=cm.split('-').map(Number),f=new Date(Y,M-1,1),n=new Date(Y,M,0).getDate(),off=(f.getDay()+6)%7;
let g=['L','M','M','J','V','S','D'].map(x=>`<small>${x}</small>`).join('')+'<span></span>'.repeat(off);
for(let d=1;d<=n;d++){const k=cm+'-'+String(d).padStart(2,'0'),m=S.m[k]||0;
g+=`<button class="cd ${k===cd?'sel':''} ${k===T?'today':''}" onclick="pickD('${k}')" style="background:rgba(var(--gl),${(pc(k)*.4).toFixed(2)})"><small>${d}</small><span>${m?MO[m-1]:(S.off[k]?'off':'')}</span>${dots(k)}</button>`}
const dd=new Date(cd+'T12:00:00'),ev=(S.ev[cd]||[]).slice().sort((a,b)=>a.s.localeCompare(b.s)),fut=cd>T,m=S.m[cd]||0,p=pc(cd),tk=S.t.filter(t=>t.x&&t.d===cd).length;
const mn=s=>+s.slice(0,2)*60+ +s.slice(3,5);
const tl=ev.filter(e=>e.s).map(e=>{const a=Math.max(mn(e.s),360),b=e.e?Math.min(mn(e.e),1440):a+30;return `<i style="left:${((a-360)/10.8).toFixed(1)}%;width:${Math.max((b-a)/10.8,2).toFixed(1)}%"></i>`}).join('');
return `<section class="card"><i class="orn li"></i><div class="top" style="align-items:center"><button class="btn" onclick="mshift(-1)" aria-label="Mois précédent">‹</button><h2 style="text-transform:capitalize">${esc(f.toLocaleDateString('fr-BE',{month:'long',year:'numeric'}))}</h2><button class="btn" onclick="mshift(1)" aria-label="Mois suivant">›</button></div>
<div class="inrow" style="margin-top:10px"><button class="btn" style="flex:1" onclick="mshift(-12)">−1 an</button><button class="btn" style="flex:1" onclick="goT()">Aujourd’hui</button><button class="btn" style="flex:1" onclick="mshift(12)">+1 an</button></div><div class="cal">${g}</div><div class="mu" style="margin-top:10px">Intensité = habitudes validées · emoji = humeur · point = événement</div></section>
${dayPanel()}`}
let evTy='cours';
const dots=k=>{const a=(S.ev[k]||[]).map(e=>e.ty||'au');if(S.x.some(x=>x.d===k))a.push('ex');return a.length?`<em class="dts">${[...new Set(a)].slice(0,3).map(t=>`<b class="t-${t}"></b>`).join('')}</em>`:''};
function setTy(t){evTy=t;document.querySelectorAll('.tyb').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['etr','erw'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=t==='ex'?'none':''})}
function addE(k){const n=document.getElementById('en').value.trim();if(!n)return;
if(evTy==='ex'){S.x.push({n,d:k});S.x.sort((a,b)=>a.d.localeCompare(b.d));save();draw();return}
const a=document.getElementById('et1').value,b=document.getElementById('et2').value,r=document.getElementById('er').checked,ds=[k];
if(r){const x=new Date(k+'T12:00:00');for(let i=1;i<15;i++){x.setDate(x.getDate()+7);ds.push(iso(x))}}
ds.forEach(d=>{(S.ev[d]=S.ev[d]||[]).push({t:n,s:a||'',e:b||'',ty:evTy,src:'m'})});save();draw()}
function delE(k,i){S.ev[k].splice(i,1);if(!S.ev[k].length)delete S.ev[k];save();draw()}
function evBlock(){
const ev=(S.ev[cd]||[]).map((e,i)=>({e,i})).sort((a,b)=>(a.e.s||'').localeCompare(b.e.s||'')),nw=hm(now);
const ex=S.x.map((x,i)=>x.d===cd?`<div class="ev"><b>Examen</b><span><i class="tg t-ex"></i>${esc(x.n)}</span><button onclick="delX(${i})" aria-label="Supprimer">✕</button></div>`:'').join('');
const rows=ev.map(o=>{const e=o.e;return `<div class="ev ${cd===T&&e.s&&e.e&&e.s<=nw&&nw<e.e?'now':''}"><b>${e.s?e.s+(e.e?'–'+e.e:''):'Journée'}</b><span><i class="tg t-${e.ty||'au'}"></i>${esc(e.t)}</span><button onclick="delE('${cd}',${o.i})" aria-label="Supprimer">✕</button></div>`}).join('');
const ty=[['cours','Cours'],['rdv','RDV'],['ex','Examen'],['au','Autre']].map(([t,l])=>`<button class="tyb ${evTy===t?'on':''}" data-t="${t}" onclick="setTy('${t}')">${l}</button>`).join('');
const hid=evTy==='ex'?' style="display:none"':'';
return `<div style="margin-top:12px">${ex+rows||'<div class="mu">Rien de prévu ce jour-là.</div>'}</div>
<div class="mu" style="margin-top:14px">Ajouter à l’agenda</div>
<div class="chips">${ty}</div>
<div id="etr"${hid}><div class="mu" style="margin-top:8px">Début et fin (facultatif)</div><div class="inrow"><input id="et1" type="time" aria-label="Début"><input id="et2" type="time" aria-label="Fin"></div></div>
<div class="inrow"><input id="en" placeholder="Intitulé (cours, rendez-vous…)" onkeydown="if(event.key==='Enter')addE('${cd}')"><button class="mic" onclick="addE('${cd}')" aria-label="Ajouter">+</button></div>
<label class="mu" id="erw"${hid} style="display:${evTy==='ex'?'none':'block'};margin-top:8px"><input id="er" type="checkbox">Chaque semaine (15 semaines)</label>`}
function dayPanel(){
const dd=new Date(cd+'T12:00:00'),fut=cd>T,m=S.m[cd]||0,p=pc(cd),tk=S.t.filter(t=>t.x&&t.d===cd).length;
const ev=(S.ev[cd]||[]).map((e,i)=>({e,i})).sort((a,b)=>(a.e.s||'').localeCompare(b.e.s||''));
const mn=s=>+s.slice(0,2)*60+ +s.slice(3,5);
const tl=ev.filter(o=>o.e.s).map(o=>{const e=o.e,a=Math.max(mn(e.s),360),b=e.e?Math.min(mn(e.e),1440):a+30;return `<i style="left:${((a-360)/10.8).toFixed(1)}%;width:${Math.max((b-a)/10.8,2).toFixed(1)}%"></i>`}).join('');
const nx=S.x.filter(x=>x.d===cd).length;
return `<section class="card hero"><h2 style="text-transform:capitalize">${esc(dd.toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'}))}</h2>${cd!==T?'<button class="btn" style="margin-top:8px" onclick="goT()">Retour à aujourd’hui</button>':''}
<div class="dtl"><svg viewBox="0 0 90 90" width="96" height="96"><circle cx="45" cy="45" r="34" fill="none" stroke="currentColor" stroke-opacity=".1" stroke-width="9"/><circle cx="45" cy="45" r="34" fill="none" stroke="rgb(var(--gl))" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(213.6*p).toFixed(1)} 213.6" transform="rotate(-90 45 45)"/><text x="45" y="51" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">${Math.round(p*100)}%</text></svg>
<div><div style="font-size:30px;line-height:1">${m?m+'/5':'—'}</div><div class="mu">${nh(cd)}/${S.h.length} habitudes</div><div class="mu">${tk} tâche${tk>1?'s':''} terminée${tk>1?'s':''}</div><div class="mu">${ev.length+nx} rendez-vous</div></div></div>
<div class="tl">${tl}</div><div class="ax"><small>6h</small><small>12h</small><small>18h</small><small>24h</small></div>
<div class="chips">${S.h.map(h=>`<button class="${has(cd,h.id)?'on':''}" ${fut?'disabled':''} onclick="tog('${cd}','${h.id}')">${h.e} ${esc(h.n)}</button>`).join('')}</div>
<div class="moods">${MO.map((e,i)=>`<button class="${m===i+1?'on':''}" ${fut?'disabled':''} onclick="moodD('${cd}',${i+1})">${e}</button>`).join('')}</div>
<div class="inrow" style="margin-top:12px"><button class="btn" style="flex:1" onclick="togOff('${cd}')">${S.off[cd]?'Jour off activé':'Jour off'}</button></div>
${evBlock()}</section>`}
const EM=/\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*/gu;
function draw(){document.getElementById('app').innerHTML=(head()+({week:weekHTML,day:()=>cd===T?dayHTML():dayPanel(),prog:progHTML,cal:calHTML}[tab]||dayHTML)()).replace(EM,'<span class="em">$&</span>');liq()}
const BW={};
function liq(){document.querySelectorAll('.bar i').forEach((el,i)=>{const k=tab+i,t=el.style.width,p=BW[k]===undefined?'0%':BW[k];BW[k]=t;if(p===t)return;el.style.width=p;el.getBoundingClientRect();el.style.width=t})}
draw();
</script></body></html>
